# -*- mode: toml -*-

# ==============================================================================
# Applications
# ==============================================================================

[keybinds]

# Web browser.
"Mod+W" = "spawn:google-chrome-stable"

# File manager.
"Mod+E" = "spawn:nautilus"

# Text editor.
"Mod+T" = "spawn:emacsclient -c"

# Email client.
"Mod+M" = "spawn:thunderbird"

# ==============================================================================
# Monitors
#
#                            +--------------+
#                            |              |
# +--------------------------+              |
# | Samsung Electric Company | Samsung      |
# | LS32D70xE                | Electric Co. |
# | HNBY100050               | LS32D70xE    |
# |                          | HNBY100538   |
# +--------------------------+              |
#                            |              |
#                            +--------------+
# ==============================================================================

# Horizontal monitor on the left for coffeelab.
[output."Samsung Electric Company LS32D70xE HNBY100050"]
focus_at_startup = true
scale = 1.0
transform = "normal"
position = [-3840, 750]
layout.scrolling.default_extent_fraction = 0.666

# Vertical monitor on the right for coffeelab.
[output."Samsung Electric Company LS32D70xE HNBY100538"]
scale = 1.0
transform = "270"
position = [0, 0]
layout.scrolling.default_extent_fraction = 1.0

# Narrower gaps on the vertical monitor. Umbriel has no per-output gap setting,
# so this is applied through workspace rules, which must select a workspace by
# index or name; indices 1-9 cover every workspace reachable via keybinds.
[[workspace]]
index = 1
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 2
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 3
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 4
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 5
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 6
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 7
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 8
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

[[workspace]]
index = 9
output = "Samsung Electric Company LS32D70xE HNBY100538"
layout.gap = 10

