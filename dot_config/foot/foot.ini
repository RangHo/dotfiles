[main]

# Use Nushell for interactive use.
shell = /usr/bin/nu

# See fontconfig settings for the custom definition of `codespace`.
font = codespace:size=14
font-bold = codespace:size=14:weight=bold
font-italic = codespace:size=14:slant=italic
font-bold-italic = codespace:size=14:weight:bold:slant=italic

# Add some padding for undecorated windows.
pad = 15x15