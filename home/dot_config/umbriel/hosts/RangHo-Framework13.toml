# ==============================================================================
# Applications
# ==============================================================================

[keybinds]

# Web browser.
"Mod+W" = "spawn firefox"

# File manager.
"Mod+E" = "spawn kitty yazi"

# Text editor.
"Mod+T" = "spawn emacsclient -c"

# Email client.
"Mod+M" = "spawn thunderbird"

# Terminal emulator.
"Mod+Return" = "spawn kitty"

# ==============================================================================
# Inputs
# ==============================================================================

[input.touchpad]
natural_scroll = true

# ==============================================================================
# Outputs
#
# +-------------------------+
# |                         |
# |          eDP-1          |
# |                         |
# |                         |
# +-------------------------+
# ==============================================================================

# Main monitor.
[output.eDP-1]
focus_at_startup = true
scale = 1.0
transform = "normal"
position = [0, 0]
workspaces = ["web", "code", "chat", "media", "misc"]


# ==============================================================================
# Events
# ==============================================================================

[events]
lid_close = "umbriel msg output-disable:eDP-1"
lid_open = "umbriel msg output-enable:eDP-1"

# ==============================================================================
# Workspaces
# ==============================================================================

# Browsing: one large window, scroll to the occasional second one.
[[workspace]]
  name = "web"
  layout.mode = "scrolling"

# Coding: editor as master, terminals stacked beside it.
[[workspace]]
  name = "code"
  layout.mode = "master"

# Chat and email: two readable half-width columns at a time.
[[workspace]]
  name = "chat"
  layout.mode = "scrolling"
  layout.scrolling.default_extent_fraction = 0.5

# Media: a single full-width player or viewer.
[[workspace]]
  name = "media"
  layout.mode = "scrolling"
  layout.scrolling.default_extent_fraction = 1.0

# Miscellaneous: let dwindle arrange whatever lands here.
[[workspace]]
  name = "misc"
  layout.mode = "dwindle"
