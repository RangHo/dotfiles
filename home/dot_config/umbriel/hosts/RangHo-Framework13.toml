# ==============================================================================
# Applications
# ==============================================================================

[keybinds]

# Web browser.
"Mod+W" = "spawn firefox"

# File manager.
"Mod+E" = "spawn kitty yazi"

# Text editor.
"Mod+T" = "spawn emacsclient -c"

# Email client.
"Mod+M" = "spawn thunderbird"

# Terminal emulator.
"Mod+Return" = "spawn kitty"

# ==============================================================================
# Inputs
# ==============================================================================

[input.touchpad]
natural_scroll = true

# ==============================================================================
# Outputs
#
# +-------------------------+
# |                         |
# |          eDP-1          |
# |                         |
# |                         |
# +-------------------------+
# ==============================================================================

# Main monitor.
[output.eDP-1]
focus_at_startup = true
scale = 1.0
transform = "normal"
position = [0, 0]
workspaces = ["web", "code", "chat", "media", "misc"]


# ==============================================================================
# Events
# ==============================================================================

[events]
lid_close = "umbriel msg output-disable:eDP-1"
lid_open = "umbriel msg output-enable:eDP-1"

# ==============================================================================
# Workspaces
# ==============================================================================

[[workspace]]
  name = "code"
  layout.mode = "master"
